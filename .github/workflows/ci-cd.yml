name: CI/CD Frontend - Build, Push ECR & Deploy

# Trigger: solo en push a la rama deploy
on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend-eval2

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build y Push a Amazon ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push a ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repositorio ECR si no existe
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Build & Push imagen multi-stage a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker build \
            --target production \
            --tag $IMAGE_URI \
            --tag $LATEST_URI \
            .

          docker push $IMAGE_URI
          docker push $LATEST_URI

          echo "Imagen publicada: $IMAGE_URI"

  # ─────────────────────────────────────────
  # JOB 2: Deploy en EC2 Frontend
  # ─────────────────────────────────────────
  deploy:
    name: Deploy en EC2 Frontend
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy vía SSH a EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_FRONTEND_USER }}
          key: ${{ secrets.EC2_FRONTEND_KEY }}
          port: 22
          script: |
            echo "=== Iniciando deploy del Frontend ==="

            # Login a ECR desde la instancia EC2
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/frontend-eval2:latest"

            # Detener y eliminar contenedor anterior
            docker stop frontend_app 2>/dev/null || true
            docker rm frontend_app 2>/dev/null || true

            # Descargar imagen más reciente desde ECR
            docker pull $IMAGE_URI

            # Iniciar nuevo contenedor
            docker run -d \
              --name frontend_app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DEBUG=False \
              -e BACKEND_URL=${{ secrets.BACKEND_INTERNAL_URL }} \
              -e SECRET_KEY=${{ secrets.FRONTEND_SECRET_KEY }} \
              $IMAGE_URI

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "=== Deploy completado ==="
            docker ps | grep frontend_app
