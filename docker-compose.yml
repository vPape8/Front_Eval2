version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: frontend-eval2:latest
    container_name: frontend_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
      - SECRET_KEY=${SECRET_KEY:-clave_secreta_cambiar_en_produccion}
    networks:
      - app_network
    restart: unless-stopped


networks:
  app_network:
    driver: bridge
    name: innovatech_network