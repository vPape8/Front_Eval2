name: CI/CD Frontend - Build, Push & Deploy

on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build y Push a Docker Hub
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push imagen multi-stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────
  # JOB 2: Deploy en EC2 Frontend (pública)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy en EC2 Frontend
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy vía SSH a EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_FRONTEND_USER }}
          key: ${{ secrets.EC2_FRONTEND_KEY }}
          port: 22
          script: |
            echo "=== Iniciando deploy del Frontend ==="

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker stop frontend_app 2>/dev/null || true
            docker rm frontend_app 2>/dev/null || true

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2:latest

            docker run -d \
              --name frontend_app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DEBUG=False \
              -e BACKEND_URL=${{ secrets.BACKEND_INTERNAL_URL }} \
              -e SECRET_KEY=${{ secrets.FRONTEND_SECRET_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2:latest

            docker image prune -f

            echo "=== Deploy completado ==="
            docker ps | grep frontend_app
